name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'stefafafan/jev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          )

          for target in "${targets[@]}"; do
            IFS=/ read -r goos goarch <<< "$target"
            name="jev_${VERSION}_${goos}_${goarch}"
            stage="dist/$name"
            binary=jev
            if [[ "$goos" == windows ]]; then
              binary=jev.exe
            fi

            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o "$stage/$binary" .
            cp LICENSE README.md "$stage/"

            if [[ "$goos/$goarch" == linux/amd64 ]]; then
              test "$("$stage/$binary" --version)" = "jev $VERSION"
            fi

            if [[ "$goos" == windows ]]; then
              (cd dist && zip -q -r "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum jev_*.tar.gz jev_*.zip > checksums.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/jev_*.tar.gz \
            dist/jev_*.zip \
            dist/checksums.txt \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
